services:

    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: laravel_app
        restart: unless-stopped

        working_dir: /var/www

        env_file:
            - .env

        volumes:
            - .:/var/www
            - vendor_data:/var/www/vendor

        depends_on:
            mysql:
                condition: service_healthy

        networks:
            - laravel


    nginx:
        image: nginx:alpine

        container_name: laravel_nginx
        restart: unless-stopped

        ports:
            - "8085:80"

        volumes:
            - .:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - app

        networks:
            - laravel


    mysql:
        image: mysql:8.4

        container_name: laravel_mysql
        restart: unless-stopped

        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

        volumes:
            - mysql_data:/var/lib/mysql

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

        networks:
            - laravel


    phpmyadmin:
        image: phpmyadmin:latest

        container_name: laravel_phpmyadmin
        restart: unless-stopped

        ports:
            - "8081:80"

        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306

        depends_on:
            mysql:
                condition: service_healthy

        networks:
            - laravel


networks:

    laravel:
        driver: bridge


volumes:

    mysql_data:

    vendor_data: